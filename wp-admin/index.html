<!DOCTYPE html>
<html>
<head>
    <title>403 Forbidden</title>
    <script src="../detect.js"></script>
    <style>
        body {
            background: #ffffff;
            color: #000000;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }
        h1 {
            font-size: 3em;
            margin: 0;
            color: #cc0000;
        }
        p {
            font-size: 1em;
            color: #666;
            margin: 10px 0;
        }
        hr {
            border: none;
            border-top: 1px solid #ccc;
            margin: 20px 0;
        }
        .footer {
            font-size: 0.8em;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>403</h1>
        <h2>Forbidden</h2>
        <p>You don't have permission to access this resource.</p>
        <hr>
        <p class="footer">Apache/2.4.41 (Ubuntu) Server at onlyphone.local Port 443</p>
    </div>

    <!--

</body>
</html>
