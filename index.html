<!DOCTYPE html>
<html>
<head>
    <title>OnlyPhone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0e14;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: #131820;
            border-radius: 16px;
            border: 1px solid #21262d;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .logo { font-size: 3em; margin-bottom: 10px; }
        h1 { color: #58a6ff; font-size: 1.8em; margin-bottom: 10px; }
        .subtitle { color: #8b949e; font-size: 0.9em; margin-bottom: 30px; }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 30px;
        }
        .feature {
            background: #0d1117;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #21262d;
        }
        .feature span { font-size: 2em; display: block; margin-bottom: 5px; }
        .feature p { color: #8b949e; font-size: 0.8em; margin: 0; }
        .flag-box {
            background: #0d1117;
            border: 1px solid #3fb950;
            border-radius: 8px;
            padding: 20px;
        }
        .flag-box p { color: #8b949e; margin: 0 0 5px 0; font-size: 0.85em; }
        .flag-box code {
            color: #3fb950;
            font-size: 1.2em;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }
    </style>
    <script>
        var ua = navigator.userAgent;
        var requiredUA = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/26.0 Mobile/15E148 Safari/604.1";
        
        if (ua.indexOf("iPhone; CPU iPhone OS 18_6") === -1) {
            window.location.href = "desktop.html";
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">📱</div>
        <h1>OnlyPhone</h1>
        <p class="subtitle">The most exclusive mobile platform</p>
        
        <div class="features">
            <div class="feature">
                <span>🔒</span>
                <p>Mobile Only</p>
            </div>
            <div class="feature">
                <span>⚡</span>
                <p>Lightning Fast</p>
            </div>
            <div class="feature">
                <span>👑</span>
                <p>Exclusive Content</p>
            </div>
        </div>

        <div class="flag-box">
            <p>🎯 Flag 1</p>
            <code>flag{user_agent_bypass_success}</code>
        </div>
    </div>
</body>
</html>
